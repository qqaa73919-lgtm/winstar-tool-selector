<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#073b6f">
  <title>WINSTAR V4 選刀與加工參數系統</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data/icon-192.png">
  <link rel="apple-touch-icon" href="data/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">WINSTAR</span><div><h1 data-i18n="title">V4 選刀與加工參數系統</h1><p data-i18n="subtitle">快速找刀、核對官方加工條件</p></div></div>
    <nav class="top-actions">
      <button id="langButton" class="nav-button" type="button">English</button>
      <a class="nav-button" href="https://www.winstarcutting.com.tw/" target="_blank" rel="noopener" data-i18n="officialSite">WINSTAR 官方網站</a>
    </nav>
  </header>

  <main>
    <section class="category-section">
      <div class="section-heading"><div><span data-i18n="officialCategories">官方五大分類</span><h2 data-i18n="chooseCategory">選擇產品分類</h2></div><button id="showCategories" class="link-button" hidden data-i18n="backCategories">返回五大分類</button></div>
      <div id="categoryGrid" class="category-grid"></div>
    </section>

    <section id="workspace" class="workspace" hidden>
      <aside class="filter-panel">
        <div class="filter-title"><div><small id="categoryCode"></small><h2 id="categoryTitle"></h2></div><button id="resetButton" class="link-button" data-i18n="clear">清除</button></div>

        <label class="search-field"><span data-i18n="toolKeyword">刀號關鍵字</span><div class="input-clear"><input id="toolInput" type="search" autocomplete="off" data-placeholder="toolPlaceholder" placeholder="輸入完整或部分刀號"><button id="clearTool" type="button" aria-label="清除刀號">×</button></div><div id="toolSuggestions" class="suggestions" hidden></div></label>

        <label><span data-i18n="materialGroup">加工材質</span><select id="material"><option value="" data-i18n="allMaterials">全部材質</option></select></label>
        <label id="materialDetailField" hidden><span data-i18n="materialDetail">牌號／硬度細分</span><select id="materialDetail"><option value="" data-i18n="allDetails">全部細分</option></select></label>
        <label><span data-i18n="operationGroup">加工類型</span><select id="operation"><option value="" data-i18n="allOperations">全部類型</option></select></label>
        <label id="stageField" hidden><span data-i18n="stage">加工程度</span><select id="stage"><option value="" data-i18n="allStages">全部程度</option></select></label>
        <label id="strategyField" hidden><span data-i18n="strategy">加工策略</span><select id="strategy"><option value="" data-i18n="allStrategies">全部策略</option></select></label>
        <div class="field-pair"><label><span id="diameterLabel">刀具外徑 mm</span><input id="diameter" type="number" min="0.01" step="0.01" data-placeholder="optional" placeholder="選填"></label><label><span data-i18n="cutLength">所需刃長 mm</span><input id="cutLength" type="number" min="0" step="0.1" data-placeholder="optional" placeholder="選填"></label></div>
        <label><span data-i18n="maxRpm">機台最高轉速 RPM</span><input id="maxRpm" type="number" min="1" step="100" data-placeholder="optionalRecalc" placeholder="選填；會同步重算 F"></label>

        <details class="advanced"><summary data-i18n="moreFilters">更多篩選條件</summary><label><span data-i18n="series">系列</span><select id="series"><option value="" data-i18n="allSeries">全部系列</option></select></label></details>
        <button id="searchButton" class="primary" data-i18n="searchTools">查詢刀具</button>
        <p class="filter-help" data-i18n="filterHelp">選單會自動連動，只顯示確實有刀具的組合。</p>
      </aside>

      <section class="result-area">
        <div id="resultSummary" class="result-summary"></div>
        <div id="results" class="results"></div>
        <button id="loadMore" class="load-more" hidden data-i18n="showMore">顯示更多刀號</button>
      </section>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <button id="backTop" class="back-top" aria-label="回到最上方">↑</button>
  <script src="assets/app.js" defer></script>
</body>
</html>
